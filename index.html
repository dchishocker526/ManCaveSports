<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsHub • Live Scores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .score-card { transition: all 0.2s ease; }
        .score-card:hover { transform: translateY(-2px); }
        .team-card { padding: 10px 12px; font-size: 0.875rem; }
        .leading { color: #f97316; font-weight: 700; }
        .team-logo { width: 20px; height: 20px; object-fit: contain; }
        .star { cursor: pointer; transition: transform 0.2s; font-size: 1rem; }
        .star:hover { transform: scale(1.3); }
        .favorite-game { border-left: 4px solid #f97316; }
        .schedule-card { background: #111827; transition: all 0.2s ease; }
        .schedule-card:hover { transform: translateY(-2px); }
        .winner { color: #22c55e; font-weight: 600; }
        .score-flash { animation: scoreFlash 1.2s ease-out; }
        @keyframes scoreFlash {
            0% { background-color: #f97316; color: black; }
            100% { background-color: #111827; color: white; }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen pb-8">
    <div class="max-w-2xl mx-auto px-4">
        <header class="py-6 flex items-center justify-between border-b border-gray-800">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-trophy text-3xl text-orange-500"></i>
                <div>
                    <h1 class="text-3xl font-bold">SportsHub</h1>
                    <p class="text-gray-400 text-xs">Live Scores • Powered by ESPN</p>
                </div>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <span id="last-updated" class="text-gray-400"></span>
                <button onclick="refreshData()" class="flex items-center gap-2 hover:text-white text-gray-400">
                    <i class="fa-solid fa-arrows-rotate"></i> Refresh
                </button>
            </div>
        </header>

        <!-- Tabs -->
        <div class="flex gap-2 mt-6 overflow-x-auto pb-4 flex-wrap">
            <button onclick="showSport('all')" class="sport-tab active px-4 py-2.5 rounded-2xl font-medium bg-orange-500 text-black text-sm">All</button>
            <button onclick="showSport('nfl')" class="sport-tab px-4 py-2.5 rounded-2xl font-medium hover:bg-gray-800 text-sm">NFL</button>
            <button onclick="showSport('cfb')" class="sport-tab px-4 py-2.5 rounded-2xl font-medium hover:bg-gray-800 text-sm">🏈 CFB</button>
            <button onclick="showSport('nba')" class="sport-tab px-4 py-2.5 rounded-2xl font-medium hover:bg-gray-800 text-sm">NBA</button>
            <button onclick="showSport('cbb')" class="sport-tab px-4 py-2.5 rounded-2xl font-medium hover:bg-gray-800 text-sm">🏀 CBB</button>
            <button onclick="showSport('mlb')" class="sport-tab px-4 py-2.5 rounded-2xl font-medium hover:bg-gray-800 text-sm">MLB</button>
            <button onclick="showSport('softball')" class="sport-tab px-4 py-2.5 rounded-2xl font-medium hover:bg-gray-800 text-sm">🥎 Softball</button>
            <button onclick="showSport('nhl')" class="sport-tab px-4 py-2.5 rounded-2xl font-medium hover:bg-gray-800 text-sm">NHL</button>
            <button onclick="showSport('nascar')" class="sport-tab px-4 py-2.5 rounded-2xl font-medium hover:bg-gray-800 text-sm">🏎️ Cup</button>
            <button onclick="showSport('xfinity')" class="sport-tab px-4 py-2.5 rounded-2xl font-medium hover:bg-gray-800 text-sm">Xfinity</button>
            <button onclick="showSport('truck')" class="sport-tab px-4 py-2.5 rounded-2xl font-medium hover:bg-gray-800 text-sm">Truck</button>
            <button onclick="showSport('indycar')" class="sport-tab px-4 py-2.5 rounded-2xl font-medium hover:bg-gray-800 text-sm">IndyCar</button>
            <button onclick="showSport('f1')" class="sport-tab px-4 py-2.5 rounded-2xl font-medium hover:bg-gray-800 text-sm">F1</button>
        </div>

        <div id="scores-container" class="mt-6"></div>
    </div>

        let favorites = JSON.parse(localStorage.getItem('sportsFavorites')) || [];
        let previousScores = {};

        function toggleFavorite(abbreviation) {
            if (favorites.includes(abbreviation)) {
                favorites = favorites.filter(f => f !== abbreviation);
            } else {
                favorites.push(abbreviation);
            }
            localStorage.setItem('sportsFavorites', JSON.stringify(favorites));
            refreshData();
        }

        function isFavorite(abbreviation) {
            return favorites.includes(abbreviation);
        }

        // Current Standings (as of June 2026)
        const racingStandings = {

            ],

                { position: 4, driver: "Charles Leclerc", points: 154 },

        };

        function getNextRace(schedule) {
            for (let race of schedule) {
                if (race.winner === "TBD") return race;
            }
            return schedule[schedule.length - 1];
        }

        function getRecord(team) {
            if (!team) return '';
            if (team.record && team.record.wins !== undefined) {
                return `${team.record.wins}-${team.record.losses}`;
            }
            if (team.records && team.records[0] && team.records[0].summary) {
                return team.records[0].summary;
            }
            return '';
        }

        const bigTen = ['ILL','IND','IOW','MICH','MSU','MINN','NEB','NW','OSU','PSU','PUR','RUT','WIS','USC','UCLA','ORE','WASH'];

        function isBigTen(team) {
            return team && bigTen.includes((team.abbreviation || '').toUpperCase());
        }

        function isTop25(team) {
            return team && team.rank && team.rank <= 25;
        }

        function shouldShowCollegeGame(event) {
            const comp = event.competitions?.[0];
            if (!comp) return false;
            const competitors = comp.competitors || [];
            for (let c of competitors) {
                if (isTop25(c.team) || isBigTen(c.team)) return true;
            }
            return false;
        }

        function getStatusPriority(status) {
            const s = status.toLowerCase();
            if (s.includes('live') || s.includes('quarter') || s.includes('period') || s.includes('inning') || s.includes('half')) return 1;
            if (s.includes('final') || s.includes('ended') || s.includes('complete')) return 3;
            return 2;
        }

        async function fetchScores(sport) {
            const base = 'https://site.api.espn.com/apis/site/v2/sports/';
            const today = new Date().toISOString().slice(0,10).replace(/-/g, '');

            if (sport === 'all') {
                const [nfl, cfb, nba, cbb, mlb, softball, nhl, nascar] = await Promise.all([
                    fetch(base + 'football/nfl/scoreboard').then(r => r.json().catch(() => ({}))),
                    fetch(base + 'football/college-football/scoreboard').then(r => r.json().catch(() => ({}))),
                    fetch(base + 'basketball/nba/scoreboard').then(r => r.json().catch(() => ({}))),
                    fetch(base + 'basketball/mens-college-basketball/scoreboard').then(r => r.json().catch(() => ({}))),
                    fetch(`${base}baseball/mlb/scoreboard?dates=${today}`).then(r => r.json().catch(() => ({}))),
                    fetch(base + 'softball/college-softball/scoreboard').then(r => r.json().catch(() => ({}))),
                    fetch(base + 'hockey/nhl/scoreboard').then(r => r.json().catch(() => ({}))),
                    fetch(base + 'racing/nascar-premier/scoreboard').then(r => r.json().catch(() => ({})))
                ]);
                return { nfl, cfb, nba, cbb, mlb, softball, nhl, nascar };
            }

            try {
                if (sport === 'mlb') return await fetch(`${base}baseball/mlb/scoreboard?dates=${today}`).then(r => r.json());
                if (sport === 'nba') return await fetch(base + 'basketball/nba/scoreboard').then(r => r.json());
                if (sport === 'nhl') return await fetch(base + 'hockey/nhl/scoreboard').then(r => r.json());
                if (sport === 'nfl') return await fetch(base + 'football/nfl/scoreboard').then(r => r.json());
                if (sport === 'cfb') return await fetch(base + 'football/college-football/scoreboard').then(r => r.json());
                if (sport === 'cbb') return await fetch(base + 'basketball/mens-college-basketball/scoreboard').then(r => r.json());
                if (sport === 'softball') return await fetch(base + 'softball/college-softball/scoreboard').then(r => r.json());
                if (sport === 'nascar') return await fetch(base + 'racing/nascar-premier/scoreboard').then(r => r.json());
                if (sport === 'xfinity') return await fetch(base + 'racing/nascar-secondary/scoreboard').then(r => r.json());
                if (sport === 'truck') return await fetch(base + 'racing/nascar-truck/scoreboard').then(r => r.json());
                if (sport === 'indycar') return await fetch(base + 'racing/irl/scoreboard').then(r => r.json());
                if (sport === 'f1') return await fetch(base + 'racing/f1/scoreboard').then(r => r.json());
            } catch (e) {
                console.error("Fetch error:", e);
            }
            return {};
        }

        function createSection(title, data, options = {}) {
            const { showOnlyNextRace = false, showOnlyFavorites = false } = options;
            const isRacing = title.toLowerCase().includes('nascar') || title.includes('IndyCar') || title.includes('F1');
            const isMLB = title.includes('MLB');
            const isSoftball = title.includes('Softball');
            const isFootball = title.includes('NFL') || title.includes('CFB');
            const isCollege = title.includes('College') || isSoftball;

            let html = `<h2 class="text-xl font-bold mb-4 flex items-center gap-2 mt-6"><span class="text-orange-500">${getEmoji(title)}</span> ${title}</h2>`;

            if (isRacing) {
                const schedule = racingSchedules[title] || [];
                if (schedule.length === 0) return html + `<p class="text-gray-400 text-sm">No races scheduled.</p>`;

                const racesToShow = showOnlyNextRace ? [getNextRace(schedule)] : schedule;

                html += `<div class="space-y-3">`;
                racesToShow.forEach(race => {
                    const isPast = race.winner && race.winner !== "TBD";
                    html += `
                        <div class="schedule-card rounded-2xl p-4 border border-gray-700">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="font-semibold">${race.event}</div>
                                    <div class="text-sm text-gray-400">${race.track}</div>
                                </div>
                                <div class="text-right">
                                    <div class="font-medium">${race.date}</div>
                                    <div class="text-sm text-gray-400">${race.time}</div>
                                </div>
                            </div>
                            <div class="mt-3 flex justify-between text-sm">
                                <div>
                                    <span class="text-emerald-400 font-medium">TV:</span> 
                                    <span class="text-gray-300">${race.tv}</span>
                                </div>
                                ${isPast ? `<div class="winner">Winner: ${race.winner}</div>` : ''}
                            </div>
                        </div>`;
                });
                html += `</div>`;

                // Add Standings
                const standings = racingStandings[title] || [];
                if (standings.length > 0) {
                    html += `<div class="mt-4"><div class="text-sm font-medium text-gray-400 mb-2">Current Standings</div>`;
                    standings.forEach(driver => {
                        html += `
                            <div class="flex justify-between text-sm py-1 border-t border-gray-800">
                                <div><span class="font-mono w-6 inline-block">${driver.position}.</span> ${driver.driver}</div>
                                <div class="font-semibold">${driver.points} pts</div>
                            </div>`;
                    });
                    html += `</div>`;
                }

                return html;
            }

            if (!data || !data.events || data.events.length === 0) {
                return html + `<p class="text-gray-400 text-sm">No events currently available.</p>`;
            }

            let events = data.events;

            if (showOnlyFavorites) {
                events = events.filter(e => {
                    const comp = e.competitions?.[0];
                    return comp?.competitors?.some(c => isFavorite(c.team?.abbreviation));
                });
            }

            if (isCollege && !showOnlyFavorites) {
                events = events.filter(e => shouldShowCollegeGame(e));
            }

            if (events.length === 0) {
                return html + `<p class="text-gray-400 text-sm">No matching games.</p>`;
            }

            events.sort((a, b) => {
                const aHasFav = a.competitions?.[0]?.competitors?.some(c => isFavorite(c.team?.abbreviation));
                const bHasFav = b.competitions?.[0]?.competitors?.some(c => isFavorite(c.team?.abbreviation));

                if (aHasFav && !bHasFav) return -1;
                if (!aHasFav && bHasFav) return 1;

                const aStatus = a.competitions?.[0]?.status?.type?.shortDetail || '';
                const bStatus = b.competitions?.[0]?.status?.type?.shortDetail || '';
                return getStatusPriority(aStatus) - getStatusPriority(bStatus);
            });

            let cards = '';
            events.forEach(event => {
                const comp = event.competitions?.[0];
                const competitors = comp?.competitors || [];
                let status = comp?.status?.type?.shortDetail || 'TBD';

                const home = competitors.find(c => c.homeAway === 'home');
                const away = competitors.find(c => c.homeAway === 'away');
                const awayAbbr = away?.team?.abbreviation || '---';
                const homeAbbr = home?.team?.abbreviation || '---';
                const awayScore = parseInt(away?.score || 0);
                const homeScore = parseInt(home?.score || 0);

                const awayRecord = getRecord(away?.team);
                const homeRecord = getRecord(home?.team);

                const awayLogo = getLogo(away?.team);
                const homeLogo = getLogo(home?.team);

                const awayStar = isFavorite(awayAbbr) ? '⭐' : '☆';
                const homeStar = isFavorite(homeAbbr) ? '⭐' : '☆';

                const gameKey = event.id;
                const currentScore = `${awayScore}-${homeScore}`;
                let flashClass = '';
                if (previousScores[gameKey] && previousScores[gameKey] !== currentScore) {
                    flashClass = 'score-flash';
                }
                previousScores[gameKey] = currentScore;

                let extraInfo = '';

                if (isFootball && comp.situation) {
                    const sit = comp.situation;
                    extraInfo = `
                        <div class="text-xs text-gray-400 mt-1">
                            ${sit.down && sit.distance ? `${sit.down} & ${sit.distance}` : ''}
                            ${sit.yardLine ? ` • ${sit.yardLine}` : ''}
                            ${sit.possession ? ` • Poss: ${sit.possession}` : ''}
                        </div>`;
                }

                if ((isMLB || isSoftball) && comp.situation) {
                    const sit = comp.situation;
                    const inning = sit.inning || sit.period || '';
                    const isTop = sit.isTopInning !== undefined ? (sit.isTopInning ? 'Top' : 'Bot') : '';
                    const balls = sit.balls !== undefined ? sit.balls : '';
                    const strikes = sit.strikes !== undefined ? sit.strikes : '';
                    const outs = sit.outs !== undefined ? sit.outs : '';

                    extraInfo = `
                        <div class="text-xs text-gray-400 mt-1">
                            ${inning ? `${isTop} ${inning}` : ''}
                            ${balls !== '' && strikes !== '' ? ` • ${balls}-${strikes}` : ''}
                            ${outs !== '' ? ` • ${outs} out${outs != 1 ? 's' : ''}` : ''}
                        </div>`;
                }

                cards += `
                    <div class="score-card bg-gray-900 rounded-2xl mb-3 team-card ${flashClass}">
                        <div class="flex justify-between items-center">
                            <div class="flex-1">
                                <div class="flex items-center gap-2">
                                    ${awayLogo ? `<img src="${awayLogo}" class="team-logo" onerror="this.style.display='none'">` : ''}
                                    <div>
                                        <div class="font-medium">${awayAbbr}</div>
                                        <div class="text-[10px] text-gray-400">${awayRecord}</div>
                                    </div>
                                </div>
                                <span onclick="event.stopImmediatePropagation(); toggleFavorite('${awayAbbr}')" class="star text-yellow-400">${awayStar}</span>
                            </div>

                            <div class="text-center px-3">
                                <div class="font-bold">${awayScore} - ${homeScore}</div>
                                <div class="text-[10px] text-gray-400">${status}</div>
                                ${extraInfo}
                            </div>

                            <div class="flex-1 text-right">
                                <div class="flex items-center justify-end gap-2">
                                    <div>
                                        <div class="font-medium">${homeAbbr}</div>
                                        <div class="text-[10px] text-gray-400">${homeRecord}</div>
                                    </div>
                                    ${homeLogo ? `<img src="${homeLogo}" class="team-logo" onerror="this.style.display='none'">` : ''}
                                </div>
                                <span onclick="event.stopImmediatePropagation(); toggleFavorite('${homeAbbr}')" class="star text-yellow-400">${homeStar}</span>
                            </div>
                        </div>
                    </div>`;
            });

            const gridCols = isRacing ? 'grid grid-cols-1 gap-4' : 'grid grid-cols-1 sm:grid-cols-2 gap-3';
            return html + `<div class="${gridCols}">${cards}</div>`;
        }

        function getLogo(team) {
            if (!team) return '';
            return team.logo || team.logos?.[0]?.href || '';
        }

        function getEmoji(title) {
            if (title.includes('NFL') || title.includes('CFB')) return '🏈';
            if (title.includes('NBA') || title.includes('CBB')) return '🏀';
            if (title.includes('MLB') || title.includes('Softball')) return '⚾';
            if (title.includes('NHL')) return '🏒';
            if (title.includes('NASCAR') || title.includes('IndyCar') || title.includes('F1')) return '🏎️';
            return '🏆';
        }

        async function refreshData() {
            document.getElementById('last-updated').textContent = 'Updating...';
            const activeTab = document.querySelector('.sport-tab.active');
            let sport = 'all';
            if (activeTab) {
                const onclickText = activeTab.getAttribute('onclick') || '';
                sport = onclickText.match(/showSport\('(.*?)'\)/)?.[1] || 'all';
            }
            const data = await fetchScores(sport);
            renderScores(data, sport);
            document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
        }

        function renderScores(data, sport = 'all') {
            const container = document.getElementById('scores-container');
            container.innerHTML = '';

            let html = '';

            if (sport === 'all') {
                if (data.nfl) html += createSection('NFL', data.nfl, { showOnlyFavorites: true });
                if (data.cfb) html += createSection('College Football', data.cfb, { showOnlyFavorites: true });
                if (data.nba) html += createSection('NBA', data.nba, { showOnlyFavorites: true });
                if (data.cbb) html += createSection('College Basketball', data.cbb, { showOnlyFavorites: true });
                if (data.mlb) html += createSection('MLB', data.mlb, { showOnlyFavorites: true });
                if (data.softball) html += createSection('Softball', data.softball, { showOnlyFavorites: true });
                if (data.nhl) html += createSection('NHL', data.nhl, { showOnlyFavorites: true });

                html += createSection('NASCAR Cup', null, { showOnlyNextRace: true });
                html += createSection('NASCAR Xfinity', null, { showOnlyNextRace: true });
                html += createSection('NASCAR Truck', null, { showOnlyNextRace: true });
                html += createSection('IndyCar', null, { showOnlyNextRace: true });
                html += createSection('F1', null, { showOnlyNextRace: true });

            } else {
                if (sport === 'nfl') html += createSection('NFL', data);
                else if (sport === 'cfb') html += createSection('College Football', data);
                else if (sport === 'nba') html += createSection('NBA', data);
                else if (sport === 'cbb') html += createSection('College Basketball', data);
                else if (sport === 'mlb') html += createSection('MLB', data);
                else if (sport === 'softball') html += createSection('Softball', data);
                else if (sport === 'nhl') html += createSection('NHL', data);
                else if (sport === 'nascar') html += createSection('NASCAR Cup', data);
                else if (sport === 'xfinity') html += createSection('NASCAR Xfinity', data);
                else if (sport === 'truck') html += createSection('NASCAR Truck', data);
                else if (sport === 'indycar') html += createSection('IndyCar', data);
                else if (sport === 'f1') html += createSection('F1', data);
            }

            container.innerHTML = html || '<p class="text-gray-400">No data available.</p>';
        }

        function showSport(sport) {
            document.querySelectorAll('.sport-tab').forEach(tab => tab.classList.remove('active', 'bg-orange-500', 'text-black'));
            const tabs = document.querySelectorAll('.sport-tab');
            for (let tab of tabs) {
                if (tab.getAttribute('onclick').includes(`showSport('${sport}')`)) {
                    tab.classList.add('active', 'bg-orange-500', 'text-black');
                    break;
                }
            }
            refreshData();
        }

        setInterval(refreshData, 60000);
        window.onload = () => showSport('all');
    </script>
</body>
</html>
